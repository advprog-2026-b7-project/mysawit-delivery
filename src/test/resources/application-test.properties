# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
# Matikan Flyway saat test
spring.flyway.enabled=false
# Dummy values sesuai nama property di application.properties
api.auth-service.url=http://localhost:8080/api/users
app.cors.allowed-origins=http://localhost:3000
# Port test (opsional)
server.port=8082
# Pin the test secret explicitly so spring-dotenv cannot load the .env value
# and invalidate tokens minted in tests with this key.
jwt.secret=dev-secret-key-dev-secret-key-123456
