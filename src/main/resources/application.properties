spring.application.name=mysawit-delivery
# DB Configuration
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/mysawit_delivery}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
# Auth Service
api.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080/api/users}
# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
# Server Port
server.port=8082
jwt.secret=${JWT_SECRET:dev-secret-key-dev-secret-key-123456}
