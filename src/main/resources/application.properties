spring.application.name=mysawit-delivery
# DB Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/mysawit_delivery}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
# Auth Service
api.auth-service.url=${AUTH_SERVICE_BASE_URL:http://localhost:8080/api/users}
# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
# Server Port (Opsional, pastikan tidak bentrok)
plantation.service.url=${PLANTATION_SERVICE_BASE_URL:http://localhost:8081}
payment.service.base-url=${PAYMENT_SERVICE_BASE_URL:http://localhost:8084}
server.port=8082
jwt.secret=${JWT_SECRET:mysawit-secret}
inter.service.api-key=mysawit-internal-secret-key-2024
