spring.application.name=mysawit-delivery
# DB Configuration - Menggunakan nilai default jika variabel environment kosong
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5435/mysawit_delivery}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
# Hibernate & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.flyway.baseline-on-migrate=true
# Auth Service - Pastikan ini sesuai dengan yang dipanggil di @Value Java
api.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8080/api/users}
# Frontend CORS
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000}
# Server Port (Opsional, pastikan tidak bentrok)
server.port=8082